; Kompilieren und auf die ESP32-CAM laden:  cd esp32cam && pio run -t upload
[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
build_flags = -DCORE_DEBUG_LEVEL=0
; höhere Upload-Raten lieferten an diesem USB-Adapter fehlerhafte Daten
upload_speed = 115200
monitor_speed = 115200
