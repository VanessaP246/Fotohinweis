# ============================================================================
#  Einstellungen für das Foto-Rätsel – nur diese Datei muss angepasst werden.
#  Nach dem Speichern einfach `raetsel.py` (erneut) starten.
# ============================================================================

[hinweis]
# Die versteckte Botschaft. Lange Texte werden automatisch umbrochen.
text = "Blockiert WCs"

# Position der TEXTMITTE in Prozent des Bildes:
#   x: 0 = linker Rand, 50 = Mitte, 100 = rechter Rand
#   y: 0 = oberer Rand, 50 = Mitte, 100 = unterer Rand
x = 50
y = 42

# Maximale Größe des Textblocks in Prozent der Bildbreite bzw. -höhe.
# Die Schrift wird so groß wie möglich gewählt, ohne diesen Kasten zu verlassen.
# Größer = Text leichter zu finden.
breite = 90
hoehe = 80

# Drehung in Grad gegen den Uhrzeigersinn (0 = waagerecht).
drehung = 0

# Pfad zu einer fetten TTF-Schrift. Leer = Arial Black.
schrift = ""

[druck]
# Papierformat: "A4", "A5" oder "10x15cm"
papier = "A4"

# true  = Foto auf das Papierformat zuschneiden (Ränder des Fotos gehen verloren)
# false = ganzes Foto verwenden; der Bildbereich wird kleiner und auf dem Blatt zentriert
zuschneiden = false

[kamera]
# USB-Anschluss der ESP32-CAM. "auto" nimmt den ersten USB-Seriell-Adapter (/dev/cu.usbserial…).
port = "auto"

# Drehung des Kamerabilds in Grad IM Uhrzeigersinn: 0, 90, 180 oder 270.
# Hochkant aufgehängte Kamera → 90 oder 270 (einmal ausprobieren, welches richtig herum ist).
drehung = 90

# Blitz-LED der ESP32-CAM beim Foto einschalten.
blitz = false

[drucker]
# Drucker für Taste P in kamera.py (druckt output/foto_standard.pdf in Originalgröße).
# "auto" nimmt den ersten Drucker mit "DeskJet" im Namen, sonst den Standarddrucker.
# Namen aller Drucker anzeigen: im Terminal `lpstat -e`
name = "auto"

[raster]
# Rasterweite in Linien pro Zoll. Kleiner = gröbere Punkte, Textur leichter erkennbar.
lpi = 40

# Welche Varianten erzeugt werden.
#   standard: Raster im Text um 25° gedreht (subtil)
#   winkel45: Raster im Text um 45° gedreht (deutlicher)
varianten = ["standard", "winkel45"]
